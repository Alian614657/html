<!DOCTYPE html>
<head>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;700;900&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <title>LUGX Store</title>
</head>
<body>
  <!-- HEADER -->
  <div class="header" x-data="{ isMenuOpen: false }">
    <img class="logo" src="images/logo.png" />
    <div class="header-links" :class="{ 'mobile-menu': isMenuOpen }">
      <a href="test.html">Home</a>
      <a href="#">Our shop</a>
      <a href="#">Contact</a>
      <a href="#">About</a>
      <button class="btn" @click="isMenuOpen = !isMenuOpen">Sign in</button>
    </div>
  </div>

  <!-- Landing Page -->
  <div class="landing-page" x-data="{ searchQuery: '' }">
    <div class="landing-page-left-section">
      <span>Welcome To Lugx!</span>
      <h1>Best Gaming Site ever!</h1>
      <p>
        LUGX Gaming is free Bootstrap 5 HTML CSS website template for your
        gaming websites. You can download and use this layout for commercial
        purposes. Please tell your friends about TemplateMo.
      </p>
      <div class="landing-page-search">
        <input 
          placeholder="Start typing..." 
          x-model="searchQuery"
          @input="$event.target.value = $event.target.value.toLowerCase()"
        />
        <button class="btn" @click="alert('Searching for: ' + searchQuery)">SEARCH</button>
      </div>
    </div>
    <div class="landing-page-image-container">
      <img src="images/banner-image.jpg" />
    </div>
  </div>

  <!-- Trending Games -->
  <div class="trending-container" x-data="{ games: [
    { id: 1, title: 'Assassins Creed', category: 'Action', image: 'images/trending-01.jpg' },
    { id: 2, title: 'Assassins Creed', category: 'Action', image: 'images/trending-01.jpg' },
    { id: 3, title: 'Assassins Creed', category: 'Action', image: 'images/trending-01.jpg' }
  ]}">
    <span>Trending</span>
    <div class="trending-header">
      <h1>Trending Games</h1>
      <button class="btn">view all</button>
    </div>
    <div class="trending-cards">
      <template x-for="game in games" :key="game.id">
        <div class="card" 
             x-data="{ isHovered: false }"
             @mouseenter="isHovered = true"
             @mouseleave="isHovered = false">
          <img class="thumb" :src="game.image" />
          <div class="card-info">
            <div class="card-name">
              <p x-text="game.category"></p>
              <h3 x-text="game.title"></h3>
            </div>
            <a>
              <img src="images/online-shopping.png" 
                   :class="{ 'hover-effect': isHovered }" />
            </a>
          </div>
        </div>
      </template>
    </div>
  </div>
</body>
