<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <title>LUGX</title>
</head>
<body>
  <!-- HEADER -->
  <header class="header">
    <a href="index.html" class="logo"><img src="images/logo.png" alt="logo" /></a>
    <nav class="headerLinks">
      <a href="index.html">Home</a>
      <a href="#">Shop</a>
      <a href="#">Details</a>
      <a href="contactUs.html">Contact</a>
      <button class="btn">Sign In</button>
    </nav>
  </header>

  <!-- HERO -->
  <section class="landingPage">
    <div class="leftSide">
      <p class="welcome">Welcome to LUGX</p>
      <h1 class="slogan">Best Gaming Site Ever!</h1>
      <p class="description">Free Bootstrap 5 gaming template. Use it freely!</p>
      <div class="searchBar">
        <input type="text" placeholder="Type Something" />
        <button class="btn">Search</button>
      </div>
    </div>
    <div class="imageContainer">
      <img src="images/banner-image.jpg" alt="banner" />
    </div>
  </section>

  <!-- TRENDING -->
  <section class="trending">
    <div class="sectionHeader">
      <span>Trending</span>
      <h2>Trending Games</h2>
      <button class="btn">View All</button>
    </div>
    <div class="card">
      <img src="images/trending-01.jpg" alt="game" />
      <div class="cardInfo">
        <p>Action</p><h3>Assassin Creed</h3>
        <a href="#"><img src="images/online-shopping.png" alt="shop" /></a>
      </div>
    </div>
  </section>

  <!-- MOST PLAYED -->
  <section class="mostPlayed">
    <div class="sectionHeader">
      <span>Top Games</span>
      <h2>Most Played</h2>
    </div>
    <div class="card">
      <img src="images/top-game-01.jpg" alt="game" />
      <div class="cardInfo">
        <p>Adventure</p><h3>Assassin Creed</h3>
        <button class="btn">Explore</button>
      </div>
    </div>
  </section>

  <!-- CATEGORIES -->
  <section class="categories">
    <div class="sectionHeader">
      <span>Top Games</span>
      <h2>Top Categories</h2>
    </div>
    <div class="card">
      <div class="genre">Action</div>
      <img src="images/categories-01.jpg" alt="category" />
    </div>
  </section>

  <!-- FOOTER -->
  <footer class="footer">
    &copy; 2048 LUGX Gaming Company. Design: TemplateMo
  </footer>
</body>
</html>
